<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi d'Investissements</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#181b24;--surface2:#1f2332;--border:#2a2f42;
  --finary:#e8963c;--red:#f87171;--green:#6ee7b7;--blue:#60a5fa;--orange:#fb923c;
  --text:#e8eaf2;--muted:#6b7280;
  --fd:'DM Serif Display',serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(232,150,60,.04)0%,transparent 60%),
                   radial-gradient(ellipse at 80% 80%,rgba(96,165,250,.04)0%,transparent 60%);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

header{padding:32px 40px 0;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
.hdr-title h1{font-family:var(--fd);font-size:2.2rem;letter-spacing:-.5px;line-height:1.1;}
.hdr-title h1 em{color:var(--finary);font-style:italic;}
.hdr-title p{color:var(--muted);font-weight:300;margin-top:4px;font-size:13px;}
.tab-x{display:none;} /* supprimé - géré par la barre d'icônes */

.page{max-width:1200px;margin:0 auto;}
.main{padding:28px 40px 60px;}

/* TABS */
.tabs-wrap{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
.tab{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  border-radius:10px;padding:7px 16px;font-family:var(--fb);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.tab:hover{border-color:#3a4060;color:var(--text);}
.tab.on{background:var(--surface);border-color:#3a4060;color:var(--text);}
.plan-actions{display:flex;align-items:center;gap:4px;margin-left:6px;}
.plan-act-btn{display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;background:transparent;
  border:1px solid var(--border);color:var(--muted);font-size:13px;
  cursor:pointer;transition:all .15s;flex-shrink:0;}
.plan-act-btn:hover{border-color:#3a4060;color:var(--text);}
.plan-act-btn.add{color:var(--green);}
.plan-act-btn.add:hover{border-color:var(--green);background:rgba(110,231,183,.08);}
.plan-act-btn.edit:hover{border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.08);}
.plan-act-btn.del:hover{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.08);}

/* PANELS */
.panel-page{display:none;animation:fadeUp .3s ease both;}
.panel-page.on{display:block;}

/* DEUX FORMULAIRES CÔTE À CÔTE */
.two-col-forms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:0;}
@media(max-width:800px){.two-col-forms{grid-template-columns:1fr;}}

/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;
  position:relative;overflow:hidden;transition:border-color .2s;animation:fadeUp .4s ease both;}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;}
.scard:hover{border-color:#3a4060;}
.scard-gold::before{background:var(--finary);}
.scard-blue::before{background:var(--blue);}
.scard-green::before{background:var(--green);}
.scard-red::before{background:var(--red);}
.scard-gray::before{background:var(--muted);}
.card-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin-bottom:10px;}
.card-amount{font-family:var(--fd);font-size:1.8rem;line-height:1;margin-bottom:6px;}
.card-amount.gold{color:var(--finary);}
.card-amount.blue{color:var(--blue);}
.card-amount.green{color:var(--green);}
.card-amount.red{color:var(--red);}
.card-amount.neutral{color:var(--text);}
.card-sub{font-size:11px;color:var(--muted);}

/* PANEL BLOCK */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;
  margin-bottom:20px;animation:fadeUp .4s ease both;}
.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:500;margin-bottom:18px;}

/* CHART */
.chart-canvas-wrap{position:relative;margin-bottom:14px;user-select:none;}
.chart-canvas-wrap canvas{display:block;width:100%;height:240px;cursor:crosshair;}
.chart-legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.chart-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.chart-empty{padding:3rem;text-align:center;color:var(--muted);font-size:13px;}

/* TOOLTIP */
.chart-tt{position:fixed;pointer-events:none;z-index:9999;
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;font-family:var(--fb);font-size:12px;line-height:1.6;
  box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:180px;display:none;}
.ctt-date{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.ctt-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:2px 0;}
.ctt-lbl{color:var(--muted);font-size:11px;}
.ctt-val{font-family:var(--fd);font-size:1rem;}
.ctt-val.blue{color:var(--blue);}
.ctt-val.gold{color:var(--finary);}
.ctt-val.pos{color:var(--green);}
.ctt-val.neg{color:var(--red);}
.chart-crosshair{position:absolute;width:1px;background:rgba(255,255,255,.15);
  pointer-events:none;display:none;top:0;bottom:0;}

/* COLLAPSIBLE */
.coll-head{display:flex;align-items:center;gap:8px;padding:.55rem 0;cursor:pointer;user-select:none;
  font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;
  color:var(--muted);transition:color .15s;}
.coll-head:hover{color:var(--text);}
.coll-head::after{content:'';flex:1;height:1px;background:var(--border);}
.coll-arr{font-size:.5rem;transition:transform .22s;color:var(--muted);flex-shrink:0;}
.coll-head.open .coll-arr{transform:rotate(180deg);}
.coll-body{overflow:hidden;max-height:0;opacity:0;transition:max-height .28s ease,opacity .2s ease;}
.coll-body.open{max-height:3000px;opacity:1;margin-bottom:16px;}

/* SECTION LABEL */
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
  font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* FORM */
.form-block{background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.form-block .btn{align-self:flex-end;margin-bottom:1.3rem;flex-shrink:0;}
.field{display:flex;flex-direction:column;gap:5px;}
label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:var(--fb);font-size:13px;padding:9px 13px;border-radius:10px;
  outline:none;transition:border-color .2s;min-width:140px;}
input:focus{border-color:#4a5278;}
input.err{border-color:var(--red);}
.hint{font-size:11px;color:var(--muted);min-height:.9rem;}
.hint.err{color:var(--red);}

/* VERSEMENT / RETRAIT */
.op-toggle{display:flex;gap:6px;width:100%;}
.op-toggle button{flex:1;background:var(--surface);color:var(--muted);border:1px solid var(--border);
  font-family:var(--fb);font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .15s;}
.op-toggle button.on.vers{background:rgba(110,231,183,.12);border-color:var(--green);color:var(--green);}
.op-toggle button.on.retr{background:rgba(248,113,113,.12);border-color:var(--red);color:var(--red);}
.form-block .btn.retr{background:var(--red);color:#2a0a0a;}
td.td-amt.retrait{color:var(--red);}
.op-badge{display:inline-block;font-family:var(--fb);font-size:10px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:8px;vertical-align:middle;}
.op-badge.vers{background:rgba(110,231,183,.12);color:var(--green);}
.op-badge.retr{background:rgba(248,113,113,.12);color:var(--red);}

/* BUTTONS */
.btn{background:var(--green);color:#0a1a12;border:none;font-family:var(--fb);font-size:13px;
  font-weight:600;padding:10px 20px;border-radius:12px;cursor:pointer;transition:opacity .15s;
  white-space:nowrap;align-self:flex-end;margin-top:auto;}
.btn:hover{opacity:.9;}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border);
  font-family:var(--fb);font-size:13px;font-weight:500;padding:10px 18px;border-radius:12px;cursor:pointer;}
.btn-sec:hover{border-color:#3a4060;}
.btn-del{background:none;border:1px solid transparent;color:var(--red);font-family:var(--fb);
  font-size:12px;padding:4px 8px;border-radius:8px;cursor:pointer;transition:border-color .15s;}
.btn-del:hover{border-color:var(--red);}

/* TABLE */
.tbl-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--surface2);}
th{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--border);}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(42,47,66,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(255,255,255,.02);}
td.td-date{color:var(--muted);}
td.td-amt{color:var(--finary);font-family:var(--fd);font-size:1rem;}
td.td-note{color:var(--muted);font-size:12px;}
td.td-act{text-align:right;width:48px;}
.empty{padding:2.5rem;text-align:center;color:var(--muted);font-size:13px;}

/* OVERVIEW ROWS */
.ov-row{background:var(--surface2);border:1px solid var(--border);border-radius:14px;
  padding:16px 24px;margin-bottom:10px;display:grid;
  grid-template-columns:180px 1fr 1fr 1fr 1fr;
  align-items:center;gap:8px;cursor:pointer;transition:border-color .2s;}
.ov-row:hover{border-color:#3a4060;}
.ov-name{font-family:var(--fd);font-size:1.15rem;color:var(--text);}
.ov-meta{display:contents;}
.ov-stat{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;}
.ov-stat .l{font-size:10px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;font-weight:500;}
.ov-stat .v{font-size:14px;font-weight:500;}
@media(max-width:900px){
  .ov-row{grid-template-columns:1fr 1fr;row-gap:12px;}
  .ov-name{grid-column:1/-1;}
}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:.2rem .5rem;border-radius:6px;margin-left:.4rem;vertical-align:middle;font-weight:600;}
.t-pea{background:rgba(232,150,60,.12);color:var(--finary);}
.t-pee{background:rgba(96,165,250,.12);color:var(--blue);}
.t-perecco{background:rgba(110,231,183,.12);color:var(--green);}
.t-custom{background:rgba(251,146,60,.12);color:var(--orange);}
.pos{color:var(--green);}.neg{color:var(--red);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:28px;width:380px;max-width:92vw;}
.modal h2{font-family:var(--fd);font-size:1.4rem;font-weight:400;margin-bottom:20px;}
.modal .field{margin-bottom:12px;width:100%;}.modal .field input{width:100%;}
.modal-act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

@media(max-width:700px){
  header{padding:16px 12px 0;gap:8px;}
  .hdr-title h1{font-size:1.5rem;}
  .hdr-title p{font-size:12px;}
  .btn-auth{font-size:12px;padding:7px 10px;}
  header,.main{padding-left:12px;padding-right:12px;}
  .main{padding-top:16px;padding-bottom:80px;}
  .tabs-wrap{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;}
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;font-size:11px;padding:6px 12px;}
  .plan-act-btn{width:32px;height:32px;font-size:15px;}
  .cards-row{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .scard{padding:14px;}
  .card-amount{font-size:1.4rem;}
  .card-label{font-size:9px;}
  .panel{padding:14px;border-radius:12px;}
  .two-col-forms{grid-template-columns:1fr;}
  .form-block{flex-direction:column;padding:12px;gap:10px;}
  .field{width:100%;}
  input[type=text],input[type=number]{min-width:100%;width:100%;font-size:16px;padding:11px 13px;}
  .btn{width:100%;text-align:center;padding:12px;font-size:14px;}
  .btn-sec{padding:11px 14px;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:480px;}
  th,td{padding:8px 10px;font-size:12px;}
  td.td-note{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ov-row{grid-template-columns:1fr 1fr;row-gap:10px;padding:12px 14px;border-radius:10px;}
  .ov-name{grid-column:1/-1;font-size:1rem;}
  .ov-stat .v{font-size:13px;}
  .ov-stat .l{font-size:9px;}
  .modal{padding:20px;border-radius:14px;}
  .modal h2{font-size:1.2rem;}
  .chart-canvas-wrap canvas{height:180px;}
  .chart-legend{gap:10px;}
  .chart-legend-item{font-size:10px;}
  .coll-head{font-size:10px;padding:.6rem 0;}
}

/* AUTH */
.btn-auth{background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:8px 14px;font-family:var(--fb);font-size:13px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s;}
.btn-auth:hover{border-color:#3a4060;}
.btn-auth.connected{border-color:var(--green);color:var(--green);}
.auth-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;}
.sync-indicator{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
.sync-indicator.syncing{background:var(--finary);animation:pulse .8s infinite;}
.sync-indicator.synced{background:var(--green);}
.sync-indicator.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="hdr-title">
      <h1>Suivi <em>Investissements</em></h1>
      <p id="J_DATE"></p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="btn-auth" id="btnAuth" onclick="window.toggleAuth()" title="Connexion / Synchronisation">
        <span id="authIcon">👤</span>
        <span id="authLabel">Se connecter</span>
        <div class="sync-indicator" id="syncDot"></div>
      </button>
    </div>
  </header>

  <div class="main">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
      <div class="tabs-wrap" id="J_TABS" style="margin-bottom:0;flex:1;">
        <button class="tab on" data-tab="overview" id="J_TAB_OV">Vue d'ensemble</button>
      </div>
      <div class="plan-actions" id="J_PLAN_ACTIONS">
        <button class="plan-act-btn add" id="J_BTN_ADD" title="Ajouter un plan">＋</button>
        <button class="plan-act-btn edit" id="J_BTN_EDIT" title="Renommer ce plan" style="display:none">✎</button>
        <button class="plan-act-btn del" id="J_BTN_DEL" title="Supprimer ce plan" style="display:none">🗑</button>
      </div>
    </div>

    <div class="panel-page on" id="J_PANEL_overview">
      <div class="cards-row" id="J_OV_CARDS"></div>
      <div id="J_OV_CHART"></div>
      <div class="panel">
        <div class="panel-title">Détail par portefeuille</div>
        <div id="J_OV_LIST"></div>
      </div>
    </div>

    <div id="J_PLAN_PANELS"></div>
  </div>
</div>

<!-- Tooltip global -->
<div class="chart-tt" id="J_TT"></div>

<!-- Modal -->
<div class="modal-bg" id="J_MODAL">
  <div class="modal">
    <h2>Nouveau plan</h2>
    <div class="field">
      <label for="J_PLAN_INPUT">Nom du plan</label>
      <input type="text" id="J_PLAN_INPUT" placeholder="ex : Assurance-vie, CTO…">
    </div>
    <div class="modal-act">
      <button class="btn-sec" id="J_MODAL_CANCEL">Annuler</button>
      <button class="btn" id="J_MODAL_CONFIRM">Créer</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, signOut,
         GoogleAuthProvider, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc,
         getDoc, onSnapshot }                     from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyAGge4hz9EAA4BF82A5Tm1cMdddicWV0rE",
  authDomain:        "investissement-d69e8.firebaseapp.com",
  databaseURL:       "https://investissement-d69e8-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "investissement-d69e8",
  storageBucket:     "investissement-d69e8.firebasestorage.app",
  messagingSenderId: "145950506147",
  appId:             "1:145950506147:web:90cea4a64e45bf0de15316"
};
const fbApp    = initializeApp(firebaseConfig);
const fbAuth   = getAuth(fbApp);
const fbDb     = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

let currentUser    = null;
let saveTimeout    = null;
let unsubSnapshot  = null;
let userIsTyping   = false;
let typingTimeout  = null;
window._setLastLocalSave = () => {};

function setSyncDot(state) {
  const d = document.getElementById('syncDot');
  if (!d) return;
  d.className = 'sync-indicator' + (state !== 'idle' ? ' ' + state : '');
}

// ─── STORAGE & MIGRATION ───────────────────────────────────────
const STORE_KEY = 'invest_v4';
const DEFAULTS = ['PEA','PEE','PERECCO'];

function migrateV3() {
  try {
    const raw = localStorage.getItem('invest_v3');
    if (!raw) return null;
    const old = JSON.parse(raw);
    if (!old || !Array.isArray(old.plans)) return null;
    const m = { plans: old.plans, vers: {}, vals: {} };
    old.plans.forEach(function(p) {
      m.vers[p] = (old.versements && old.versements[p]) ? old.versements[p] : [];
      m.vals[p] = (old.valuations && old.valuations[p]) ? old.valuations[p] : [];
    });
    return m;
  } catch(e) { return null; }
}

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.plans)) return d;
  } catch(e) {}
  const mg = migrateV3();
  if (mg) { localStorage.setItem(STORE_KEY, JSON.stringify(mg)); return mg; }
  return { plans: ['PEA','PEE','PERECCO'], vers: {}, vals: {} };
}

function saveData() {
  // localStorage
  try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); } catch(e) {}
  // Firebase (debounce 1.5s)
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveToFirebase, 1500);
}

// D doit être déclaré tôt car toutes les fonctions l'utilisent
const D = loadData();
D.plans.forEach(function(p) {
  if (!D.vers[p]) D.vers[p] = [];
  if (!D.vals[p]) D.vals[p] = [];
});

async function saveToFirebase() {
  if (!currentUser) return;
  setSyncDot('syncing');
  if (window._setLastLocalSave) window._setLastLocalSave();
  try {
    await setDoc(doc(fbDb, 'users', currentUser.uid, 'invest', 'data'), {
      investData: D, updatedAt: Date.now()
    });
    if (window._setLastLocalSave) window._setLastLocalSave();
    setSyncDot('synced');
    setTimeout(() => setSyncDot('idle'), 2000);
  } catch(e) {
    console.error('Firebase save error', e);
    setSyncDot('error');
  }
}

async function loadFromFirebase() {
  if (!currentUser) return false;
  setSyncDot('syncing');
  try {
    const snap = await getDoc(doc(fbDb, 'users', currentUser.uid, 'invest', 'data'));
    if (snap.exists()) {
      const d = snap.data();
      if (d.investData && Array.isArray(d.investData.plans)) {
        Object.assign(D, d.investData);
        // S'assurer que tous les plans ont leurs tableaux
        D.plans.forEach(function(p) {
          if (!D.vers[p]) D.vers[p] = [];
          if (!D.vals[p]) D.vals[p] = [];
        });
        try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); } catch(e2) {}
      }
    }
    setSyncDot('synced');
    setTimeout(() => setSyncDot('idle'), 2000);

    // Écoute temps réel
    if (unsubSnapshot) unsubSnapshot();
    let lastLocalSave = 0;
    let pendingData = null;
    let applyTimeout = null;
    window._setLastLocalSave = () => { lastLocalSave = Date.now(); };

    function applyRemote(d) {
      if (d.investData && Array.isArray(d.investData.plans)) {
        Object.assign(D, d.investData);
        D.plans.forEach(function(p) {
          if (!D.vers[p]) D.vers[p] = [];
          if (!D.vals[p]) D.vals[p] = [];
        });
        rebuildUI();
        setSyncDot('synced');
        setTimeout(() => setSyncDot('idle'), 2000);
        pendingData = null;
      }
    }

    unsubSnapshot = onSnapshot(
      doc(fbDb, 'users', currentUser.uid, 'invest', 'data'),
      (snapRT) => {
        if (!snapRT.exists()) return;
        if (Date.now() - lastLocalSave < 10000) return;
        const d = snapRT.data();
        if (userIsTyping) {
          pendingData = d;
          if (applyTimeout) clearInterval(applyTimeout);
          applyTimeout = setInterval(() => {
            if (!userIsTyping && pendingData) { clearInterval(applyTimeout); applyRemote(pendingData); }
          }, 1000);
          return;
        }
        applyRemote(d);
      },
      (err) => { console.error('Snapshot error', err); setSyncDot('error'); }
    );
    return true;
  } catch(e) {
    console.error('Firebase load error', e);
    setSyncDot('error');
    return false;
  }
}

function todayStr() {
  var n = new Date();
  return pad(n.getDate()) + '/' + pad(n.getMonth()+1) + '/' + n.getFullYear();
}
function pad(n) { return String(n).padStart(2,'0'); }
function parseDMY(s) {
  if (!s || !/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return null;
  var p = s.split('/');
  var dt = new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(dt.getTime()) ? null : dt;
}
function isDateOK(s) { return parseDMY(s) !== null; }
function yearsBetween(a, b) { return (b - a) / (1000*60*60*24*365.25); }
function autoDate(input) {
  var digits = input.value.replace(/\D/g,'').slice(0,8);
  var v = digits;
  if (digits.length > 2) v = digits.slice(0,2) + '/' + digits.slice(2);
  if (digits.length > 4) v = digits.slice(0,2) + '/' + digits.slice(2,4) + '/' + digits.slice(4);
  if (input.value !== v) input.value = v;
}

// ═══════════════════════════════════
//  TRI (Taux de Rendement Interne)
// ═══════════════════════════════════
// Calcule le TRI annualisé à partir d'une liste de flux et d'une date de référence.
// flux = [{ts (ms), montant (négatif = sortie, positif = entrée)}]
// Utilise Newton-Raphson pour résoudre VAN(r) = 0.
function calcTRI(flux) {
  if (!flux || flux.length < 2) return null;

  // Trier par date
  flux = flux.slice().sort(function(a,b){ return a.ts - b.ts; });
  var t0 = flux[0].ts; // date de référence (premier flux)

  // Convertir les ts en fractions d'année depuis t0
  var flows = flux.map(function(f) {
    return { t: yearsBetween(new Date(t0), new Date(f.ts)), m: f.montant };
  });

  // VAN(r) = somme( m_i / (1+r)^t_i )
  function npv(r) {
    var sum = 0;
    for (var i=0; i<flows.length; i++) {
      var denom = Math.pow(1 + r, flows[i].t);
      if (denom === 0) return NaN;
      sum += flows[i].m / denom;
    }
    return sum;
  }
  // Dérivée de VAN par rapport à r
  function dnpv(r) {
    var sum = 0;
    for (var i=0; i<flows.length; i++) {
      var t = flows[i].t;
      if (t === 0) continue;
      sum -= t * flows[i].m / Math.pow(1 + r, t + 1);
    }
    return sum;
  }

  // Newton-Raphson avec plusieurs points de départ
  function tryNewton(r0) {
    var r = r0;
    for (var iter=0; iter<200; iter++) {
      var f = npv(r);
      var df = dnpv(r);
      if (Math.abs(df) < 1e-12) break;
      var nr = r - f/df;
      if (nr < -0.9999) nr = -0.9999; // éviter (1+r) <= 0
      if (Math.abs(nr - r) < 1e-10) { r = nr; break; }
      r = nr;
    }
    if (isNaN(r) || !isFinite(r)) return null;
    if (Math.abs(npv(r)) > 1) return null; // pas convergé
    return r;
  }

  // Essayer plusieurs points de départ pour trouver la bonne racine
  var candidates = [0.05, 0.10, 0.20, 0.50, -0.05, -0.20, 1.0, 2.0];
  var best = null;
  for (var c=0; c<candidates.length; c++) {
    var res = tryNewton(candidates[c]);
    if (res !== null && res > -1) {
      if (best === null || Math.abs(npv(res)) < Math.abs(npv(best))) best = res;
    }
  }
  if (best === null) return null;
  return best * 100; // en %
}

// ═══════════════════════════════════
//  STATS
// ═══════════════════════════════════
function planStats(p) {
  var vers = D.vers[p] || [], vals = D.vals[p] || [];
  // montant > 0 = versement, montant < 0 = retrait. totalVerse = versements NETS.
  var totalVerse = vers.reduce(function(s,v){ return s + v.montant; }, 0);
  var totalRetire = vers.reduce(function(s,v){ return s + (v.montant < 0 ? -v.montant : 0); }, 0);
  var latestVal = null;
  if (vals.length > 0) {
    latestVal = vals.slice().sort(function(a,b){ return parseDMY(b.date) - parseDMY(a.date); })[0];
  }
  var valAct = latestVal ? latestVal.valeur : null;
  var rendTotal = null, rendPct = null, rendAnnPct = null;
  if (valAct !== null && vers.length > 0) {
    rendTotal = valAct - totalVerse;
    rendPct = totalVerse > 0 ? (rendTotal / totalVerse) * 100 : null;

    // TRI : chaque versement est un flux négatif (sortie de cash), chaque retrait un flux positif,
    // la valeur actuelle est le flux positif final à la date de la dernière valorisation.
    if (vers.length > 0) {
      var flux = vers.map(function(v) {
        return { ts: parseDMY(v.date).getTime(), montant: -v.montant };
      });
      flux.push({ ts: parseDMY(latestVal.date).getTime(), montant: valAct });
      rendAnnPct = calcTRI(flux);
    }
  }
  return { totalVerse:totalVerse, totalRetire:totalRetire, valAct:valAct, rendTotal:rendTotal, rendPct:rendPct, rendAnnPct:rendAnnPct, latestVal:latestVal, nbVers:vers.length };
}

function globalStats() {
  var tv = 0, tva = 0, has = false;
  D.plans.forEach(function(p) {
    var s = planStats(p);
    tv += s.totalVerse;
    if (s.valAct !== null) { tva += s.valAct; has = true; }
  });
  var rt = has ? tva - tv : null;
  var rp = (has && tv > 0) ? (rt / tv) * 100 : null;
  var tr = 0;
  D.plans.forEach(function(p){ tr += planStats(p).totalRetire; });

  // TRI global : tous les versements de tous les plans comme flux négatifs (retraits = flux positifs),
  // la somme des dernières valorisations connues comme flux positif final.
  var rendAnnPct = null;
  if (has && tva >= 0) {
    var flux = [];
    // Déterminer la date de référence finale = dernière date de valorisation connue (tous plans)
    var lastValDate = null;
    D.plans.forEach(function(p) {
      var s = planStats(p);
      if (s.latestVal) {
        var dv = parseDMY(s.latestVal.date);
        if (!lastValDate || dv > lastValDate) lastValDate = dv;
      }
    });
    if (lastValDate) {
      // Flux négatifs : tous les versements de tous les plans
      D.plans.forEach(function(p) {
        (D.vers[p]||[]).forEach(function(v) {
          flux.push({ ts: parseDMY(v.date).getTime(), montant: -v.montant });
        });
      });
      // Flux positif final : somme des dernières valorisations à la date lastValDate
      var totalLastVal = 0;
      D.plans.forEach(function(p) {
        var s = planStats(p);
        if (s.valAct !== null) totalLastVal += s.valAct;
      });
      flux.push({ ts: lastValDate.getTime(), montant: totalLastVal });
      rendAnnPct = calcTRI(flux);
    }
  }
  return { tv:tv, tr:tr, tva:has?tva:null, rt:rt, rp:rp, rendAnnPct:rendAnnPct };
}

// Construit les données agrégées de tous les plans pour la vue d'ensemble
function buildGlobalChartPts() {
  var allVers = [], allVals = [];
  D.plans.forEach(function(p) {
    (D.vers[p]||[]).forEach(function(v){ allVers.push(v); });
    (D.vals[p]||[]).forEach(function(v){ allVals.push(v); });
  });
  if (allVers.length === 0) return null;

  allVers.sort(function(a,b){ return parseDMY(a.date)-parseDMY(b.date); });
  allVals.sort(function(a,b){ return parseDMY(a.date)-parseDMY(b.date); });

  // Cumul versements par date (tous plans)
  var versMap = {};
  allVers.forEach(function(v) {
    var ts = parseDMY(v.date).getTime();
    versMap[ts] = (versMap[ts]||0) + v.montant;
  });
  var versTsList = Object.keys(versMap).map(Number).sort(function(a,b){ return a-b; });
  var cumul = 0;
  var versPts = versTsList.map(function(ts) {
    cumul += versMap[ts];
    var d = new Date(ts);
    return { ts:ts, dateStr:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(), cumVers:Math.max(0, cumul) };
  });

  // Valeur totale par date : somme de la dernière valeur connue de chaque plan à cette date
  var valTsSet = {};
  allVals.forEach(function(v){ valTsSet[parseDMY(v.date).getTime()] = true; });
  var valTsList = Object.keys(valTsSet).map(Number).sort(function(a,b){ return a-b; });
  var valPtsRaw = valTsList.map(function(ts) {
    var d = new Date(ts);
    var total = 0;
    var hasSome = false;
    D.plans.forEach(function(p) {
      var pv = (D.vals[p]||[]).filter(function(v){ return parseDMY(v.date).getTime()<=ts; });
      if (pv.length > 0) {
        pv.sort(function(a,b){ return parseDMY(a.date)-parseDMY(b.date); });
        total += pv[pv.length-1].valeur;
        hasSome = true;
      }
    });
    if (!hasSome) return null;
    var cv = 0;
    for (var k=versPts.length-1; k>=0; k--) {
      if (versPts[k].ts<=ts){ cv=versPts[k].cumVers; break; }
    }
    return { ts:ts, dateStr:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(), valeur:total, cumVersAtDate:cv };
  }).filter(Boolean);

  var tsSet2 = {};
  versPts.forEach(function(p){ tsSet2[p.ts]=true; });
  valPtsRaw.forEach(function(p){ tsSet2[p.ts]=true; });
  var allTs = Object.keys(tsSet2).map(Number).sort(function(a,b){ return a-b; });
  var allPts = allTs.map(function(ts) {
    var d = new Date(ts);
    var dateStr = pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
    var cv = 0;
    for (var k=versPts.length-1; k>=0; k--){ if(versPts[k].ts<=ts){cv=versPts[k].cumVers;break;} }
    var vat = null;
    for (var j=valPtsRaw.length-1; j>=0; j--){ if(valPtsRaw[j].ts<=ts){vat=valPtsRaw[j].valeur;break;} }
    return { ts:ts, dateStr:dateStr, cumVers:cv, valAtDate:vat };
  });
  return { versPts:versPts, valPtsRaw:valPtsRaw, allPts:allPts };
}

function buildChartPts(plan) {
  var vers = (D.vers[plan] || []).slice().sort(function(a,b){ return parseDMY(a.date)-parseDMY(b.date); });
  var vals = (D.vals[plan] || []).slice().sort(function(a,b){ return parseDMY(a.date)-parseDMY(b.date); });
  if (vers.length === 0) return null;

  // ── Courbe versements : un point par versement (cumulé) ──
  // On regroupe les versements par date pour cumuler correctement
  var versMap = {};
  vers.forEach(function(v) {
    var ts = parseDMY(v.date).getTime();
    versMap[ts] = (versMap[ts] || 0) + v.montant;
  });
  var versTsList = Object.keys(versMap).map(Number).sort(function(a,b){ return a-b; });
  var cumul = 0;
  var versPts = versTsList.map(function(ts) {
    cumul += versMap[ts];
    var d = new Date(ts);
    return { ts:ts, dateStr:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(), cumVers:Math.max(0, cumul) };
  });

  // ── Courbe valuations : un point par valuation ──
  var valPtsRaw = vals.map(function(v) {
    var ts = parseDMY(v.date).getTime();
    var d = new Date(ts);
    // cumVers interpolé à cette date (pour comparer dans le tooltip et les aires)
    var cv = 0;
    for (var k=versPts.length-1; k>=0; k--) {
      if (versPts[k].ts <= ts) { cv = versPts[k].cumVers; break; }
    }
    return { ts:ts, dateStr:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(), valeur:v.valeur, cumVersAtDate:cv };
  });

  // ── Liste unifiée pour le tooltip (toutes dates, avec contexte) ──
  var tsSet = {};
  versPts.forEach(function(p){ tsSet[p.ts] = true; });
  valPtsRaw.forEach(function(p){ tsSet[p.ts] = true; });
  var allTs = Object.keys(tsSet).map(Number).sort(function(a,b){ return a-b; });
  var allPts = allTs.map(function(ts) {
    var d = new Date(ts);
    var dateStr = pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
    // cumVers à ce ts
    var cv = 0;
    for (var k=versPts.length-1; k>=0; k--) { if (versPts[k].ts<=ts){cv=versPts[k].cumVers;break;} }
    // valAtDate à ce ts
    var vat = null;
    for (var j=valPtsRaw.length-1; j>=0; j--) { if (valPtsRaw[j].ts<=ts){vat=valPtsRaw[j].valeur;break;} }
    return { ts:ts, dateStr:dateStr, cumVers:cv, valAtDate:vat };
  });

  return { versPts:versPts, valPtsRaw:valPtsRaw, allPts:allPts };
}

// ═══════════════════════════════════
//  DRAW CHART
// ═══════════════════════════════════
function drawChart(canvas, plan) {
  var data = buildChartPts(plan);
  if (!data) return;
  drawChartFromData(canvas, data);
}

function drawChartFromData(canvas, data) {
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height;
  ctx.clearRect(0,0,W,H);

  var versPts   = data.versPts;    // [{ts, dateStr, cumVers}, ...]
  var valPtsRaw = data.valPtsRaw;  // [{ts, dateStr, valeur, cumVersAtDate}, ...]
  var allPts    = data.allPts;     // liste unifiée pour tooltip

  if (versPts.length === 0) return;

  // Y range sur toutes les valeurs
  var allY = versPts.map(function(p){ return p.cumVers; });
  valPtsRaw.forEach(function(p){ allY.push(p.valeur); });
  var maxY = Math.max.apply(null, allY) * 1.15 || 1;

  var PL=62, PR=14, PT=16, PB=36;
  var CW=W-PL-PR, CH=H-PT-PB;

  // Axes temporels : min/max sur toutes les dates
  var allTs = allPts.map(function(p){ return p.ts; });
  var minTs = Math.min.apply(null, allTs);
  var maxTs = Math.max.apply(null, allTs);
  var tsRange = maxTs - minTs || 1;

  // Convertir un timestamp en x pixel
  function xTs(ts) { return PL + ((ts - minTs) / tsRange) * CW; }
  // Convertir une valeur en y pixel
  function yOf(v)  { return PT + CH - (v / maxY) * CH; }

  // Coordonnées pixel de la courbe versements
  var vPx = versPts.map(function(p){ return {x:xTs(p.ts), y:yOf(p.cumVers), cv:p.cumVers, ts:p.ts}; });
  // Coordonnées pixel de la courbe valuations
  var wPx = valPtsRaw.map(function(p){ return {x:xTs(p.ts), y:yOf(p.valeur), val:p.valeur, cv:p.cumVersAtDate, ts:p.ts}; });
  var hasVal = wPx.length >= 1;

  // Interpoler la valeur cumVers (€) à un x pixel donné (forme escalier)
  function interpCV(tx) {
    if (tx < vPx[0].x) return vPx[0].cv;
    for (var k=0; k<vPx.length-1; k++) {
      if (tx >= vPx[k].x && tx < vPx[k+1].x) {
        return vPx[k].cv; // palier
      }
    }
    return vPx[vPx.length-1].cv;
  }
  // Interpoler y pixel versements à un x pixel donné (forme escalier)
  // Entre deux points, la valeur reste constante jusqu'au prochain versement
  function interpVY(tx) {
    if (tx < vPx[0].x) return vPx[0].y;
    for (var k=0; k<vPx.length-1; k++) {
      if (tx >= vPx[k].x && tx < vPx[k+1].x) {
        return vPx[k].y; // palier horizontal
      }
    }
    return vPx[vPx.length-1].y;
  }

  // ── Grille ──
  ctx.setLineDash([2,5]);
  ctx.strokeStyle = 'rgba(42,47,66,0.9)';
  ctx.lineWidth = 1;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(107,114,128,0.85)';
  ctx.font = "11px 'DM Sans',sans-serif";
  for (var i=0; i<=4; i++) {
    var gv = (maxY*i)/4, gy = yOf(gv);
    ctx.beginPath(); ctx.moveTo(PL,gy); ctx.lineTo(PL+CW,gy); ctx.stroke();
    var lbl = gv>=1000 ? (gv/1000).toFixed(gv%1000===0?0:1)+' k' : Math.round(gv).toString();
    ctx.fillText(lbl+' €', PL-6, gy+3.5);
  }
  ctx.setLineDash([]);

  // Fonction qui trace un chemin en escalier pour les versements
  // Pour chaque segment : on part du point A, on va horizontalement
  // jusqu'au x de B (palier), puis verticalement jusqu'à B (marche).
  function stepPath(ctx, pts) {
    if (pts.length === 0) return;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var si=1; si<pts.length; si++) {
      ctx.lineTo(pts[si].x, pts[si-1].y); // horizontal jusqu'au x suivant
      ctx.lineTo(pts[si].x, pts[si].y);   // vertical jusqu'au y suivant
    }
  }

  // xFin : la courbe bleue doit s'étendre jusqu'à la dernière date connue
  // (dernier versement OU dernière valuation, selon ce qui est le plus tard)
  var xFin = vPx[vPx.length-1].x;
  if (hasVal && wPx[wPx.length-1].x > xFin) xFin = wPx[wPx.length-1].x;
  var yFin = vPx[vPx.length-1].y; // le palier final = dernier cumul

  // ── Fonctions d'interpolation de la courbe valuation ──
  function interpWY(tx) {
    if (wPx.length === 0) return 0;
    if (tx <= wPx[0].x) return wPx[0].y;
    if (tx >= wPx[wPx.length-1].x) return wPx[wPx.length-1].y;
    for (var k=0; k<wPx.length-1; k++) {
      if (tx >= wPx[k].x && tx <= wPx[k+1].x) {
        var t=(tx-wPx[k].x)/(wPx[k+1].x-wPx[k].x);
        return wPx[k].y + t*(wPx[k+1].y-wPx[k].y);
      }
    }
    return wPx[wPx.length-1].y;
  }
  function interpWV(tx) {
    if (wPx.length === 0) return 0;
    if (tx <= wPx[0].x) return wPx[0].val;
    if (tx >= wPx[wPx.length-1].x) return wPx[wPx.length-1].val;
    for (var k=0; k<wPx.length-1; k++) {
      if (tx >= wPx[k].x && tx <= wPx[k+1].x) {
        var t=(tx-wPx[k].x)/(wPx[k+1].x-wPx[k].x);
        return wPx[k].val + t*(wPx[k+1].val-wPx[k].val);
      }
    }
    return wPx[wPx.length-1].val;
  }

  // ── Aire bleue : sous la courbe versements (escalier + extension finale) ──
  if (vPx.length >= 1) {
    ctx.beginPath();
    ctx.moveTo(vPx[0].x, yOf(0));
    ctx.lineTo(vPx[0].x, vPx[0].y);
    for (var si=1; si<vPx.length; si++) {
      ctx.lineTo(vPx[si].x, vPx[si-1].y);
      ctx.lineTo(vPx[si].x, vPx[si].y);
    }
    ctx.lineTo(xFin, yFin);
    ctx.lineTo(xFin, yOf(0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(96,165,250,0.22)'; ctx.fill();
  }

  // ── Aire dorée/rouge entre les deux courbes ──
  // Stratégie : construire deux polygones continus (le contour supérieur et le contour
  // inférieur de la zone), en échantillonnant à haute densité pour capturer tous les
  // sauts de l'escalier et les croisements éventuels.
  if (hasVal) {
    // Plage X commune : de la première valuation à la dernière
    var xAreaL = wPx[0].x;
    var xAreaR = wPx[wPx.length-1].x;

    // Collecter TOUS les x significatifs (valuations + versements dans la plage)
    var keyXs = [xAreaL, xAreaR];
    wPx.forEach(function(p){ keyXs.push(p.x); });
    // Pour les versements dans la plage : ajouter x-epsilon (juste avant le saut) et x (après)
    vPx.forEach(function(p){
      if (p.x >= xAreaL && p.x <= xAreaR) {
        keyXs.push(p.x - 0.001);
        keyXs.push(p.x);
        keyXs.push(p.x + 0.001);
      }
    });
    keyXs = keyXs.filter(function(x){ return x >= xAreaL && x <= xAreaR; });
    keyXs = keyXs.filter(function(x,i,a){ return a.indexOf(x)===i; });
    keyXs.sort(function(a,b){ return a-b; });

    // Pour chaque sous-segment entre deux x clés consécutifs
    for (var j=0; j<keyXs.length-1; j++) {
      var xa = keyXs[j], xb = keyXs[j+1];
      if (xb - xa < 0.0001) continue;

      var wyA = interpWY(xa), wyB = interpWY(xb);
      var vyA = interpVY(xa), vyB = interpVY(xb); // escalier : valeur au milieu du segment
      // Pour l'escalier, on prend la valeur au centre du segment (pas au bord)
      var xMid = (xa+xb)/2;
      var vyMid = interpVY(xMid);
      // On utilise la valeur du palier en vigueur : vyMid est constante sur tout le sous-segment
      vyA = vyMid; vyB = vyMid;

      var diffA = interpWV(xa) - interpCV(xa);
      var diffB = interpWV(xb) - interpCV(xb);
      var diffM = interpWV(xMid) - interpCV(xMid);

      if (Math.abs(diffM) < 0.01) continue; // lignes confondues, rien à dessiner

      if (diffA * diffB >= 0) {
        // Pas de croisement dans ce sous-segment
        var col = diffM >= 0 ? 'rgba(232,150,60,0.30)' : 'rgba(248,113,113,0.30)';
        ctx.beginPath();
        ctx.moveTo(xa, wyA); ctx.lineTo(xb, wyB);
        ctx.lineTo(xb, vyB); ctx.lineTo(xa, vyA);
        ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
      } else {
        // Croisement : dichotomie
        var xlo2=xa, xhi2=xb;
        for (var it=0; it<30; it++) {
          var xm2=(xlo2+xhi2)/2;
          if ((interpWV(xm2)-interpCV(xm2))*diffA < 0) xhi2=xm2; else xlo2=xm2;
        }
        var xi2=(xlo2+xhi2)/2;
        var wyi2=interpWY(xi2), vyi2=interpVY(xi2);

        ctx.beginPath();
        ctx.moveTo(xa,wyA); ctx.lineTo(xi2,wyi2); ctx.lineTo(xi2,vyi2); ctx.lineTo(xa,vyA); ctx.closePath();
        ctx.fillStyle = diffA>=0 ? 'rgba(232,150,60,0.30)' : 'rgba(248,113,113,0.30)'; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(xi2,wyi2); ctx.lineTo(xb,wyB); ctx.lineTo(xb,vyB); ctx.lineTo(xi2,vyi2); ctx.closePath();
        ctx.fillStyle = diffB>=0 ? 'rgba(232,150,60,0.30)' : 'rgba(248,113,113,0.30)'; ctx.fill();
      }
    }
  }

  // ── Ligne bleue versements : escalier + prolongation finale ──
  if (vPx.length >= 1) {
    ctx.beginPath();
    stepPath(ctx, vPx);
    if (xFin > vPx[vPx.length-1].x) ctx.lineTo(xFin, yFin);
    ctx.strokeStyle = 'rgba(96,165,250,1)'; ctx.lineWidth = 2; ctx.stroke();

  }

  // ── Lignes valuation (ses propres points uniquement) ──
  if (hasVal) {
    for (var k=0; k<wPx.length-1; k++) {
      var vva=wPx[k], vvb=wPx[k+1];
      var col = vva.val >= interpCV(vva.x) ? 'rgba(232,150,60,1)' : 'rgba(248,113,113,1)';
      ctx.beginPath(); ctx.moveTo(vva.x,vva.y); ctx.lineTo(vvb.x,vvb.y);
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    }

  }

  // ── Labels X : première et dernière date de l'ensemble ──
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(107,114,128,0.85)';
  ctx.textAlign = 'center';
  ctx.font = "11px 'DM Sans',sans-serif";
  var n = allPts.length;
  if (n >= 1) {
    ctx.fillText(allPts[0].dateStr, xTs(allPts[0].ts), H-PB+18);
    if (n > 1) ctx.fillText(allPts[n-1].dateStr, xTs(allPts[n-1].ts), H-PB+18);
    if (n > 3) {
      var mid = Math.floor(n/2);
      ctx.fillText(allPts[mid].dateStr, xTs(allPts[mid].ts), H-PB+18);
    }
  }
}

// ═══════════════════════════════════
//  RENDER CHART + TOOLTIP
// ═══════════════════════════════════
function renderChart(plan) {
  var box = document.getElementById('chbox-'+plan);
  if (!box) return;
  box.innerHTML = '';
  if ((D.vers[plan]||[]).length === 0) {
    box.appendChild(mk('div','chart-empty','Ajoutez des versements pour afficher le graphique'));
    return;
  }

  var wrap = mk('div','panel'); wrap.style.animationDelay = '0s';
  wrap.appendChild(mk('div','panel-title','Évolution du plan'));

  var canvasWrap = mk('div','chart-canvas-wrap');
  var canvas = document.createElement('canvas');
  canvas.style.width = '100%'; canvas.style.height = '240px';

  // Crosshair
  var crosshair = mk('div','chart-crosshair');
  canvasWrap.appendChild(canvas);
  canvasWrap.appendChild(crosshair);
  wrap.appendChild(canvasWrap);

  // Légende
  var legend = mk('div','chart-legend');
  var d1=mk('span','chart-dot'); d1.style.background='rgba(96,165,250,0.9)';
  var l1=mk('span','chart-legend-item'); l1.appendChild(d1); l1.appendChild(document.createTextNode(' Versements nets cumulés'));
  var d2=mk('span','chart-dot'); d2.style.background='rgba(232,150,60,0.9)';
  var l2=mk('span','chart-legend-item'); l2.appendChild(d2); l2.appendChild(document.createTextNode(' Plus-value'));
  var d3=mk('span','chart-dot'); d3.style.background='rgba(248,113,113,0.9)';
  var l3=mk('span','chart-legend-item'); l3.appendChild(d3); l3.appendChild(document.createTextNode(' Moins-value'));
  legend.appendChild(l1); legend.appendChild(l2); legend.appendChild(l3);
  wrap.appendChild(legend);
  box.appendChild(wrap);

  var tt = document.getElementById('J_TT');

  requestAnimationFrame(function() {
    var data = buildChartPts(plan);
    if (!data) return;
    drawChartFromData(canvas, data);

    var data = buildChartPts(plan);
    if (!data) return;
    var allPts = data.allPts;
    if (!allPts || allPts.length === 0) return;

    var PL=62, PR=14;
    var minTs2 = allPts[0].ts;
    var maxTs2 = allPts[allPts.length-1].ts;
    var tsRange2 = maxTs2 - minTs2 || 1;

    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      var CW = rect.width - PL - PR;
      var relX = e.clientX - rect.left - PL;

      if (relX < 0 || relX > CW) {
        tt.style.display = 'none';
        crosshair.style.display = 'none';
        return;
      }

      // Trouver le point allPts le plus proche en temps
      var fracTs = relX / CW;
      var hoverTs = minTs2 + fracTs * tsRange2;
      var idx = 0, bestDist = Infinity;
      for (var ii=0; ii<allPts.length; ii++) {
        var d2 = Math.abs(allPts[ii].ts - hoverTs);
        if (d2 < bestDist) { bestDist = d2; idx = ii; }
      }
      var pt = allPts[idx];

      // Crosshair
      var xPx = PL + ((pt.ts - minTs2) / tsRange2) * CW;
      crosshair.style.left = xPx + 'px';
      crosshair.style.top = '16px';
      crosshair.style.height = (rect.height - 52) + 'px';
      crosshair.style.display = 'block';

      // Tooltip contenu
      var pv = pt.valAtDate !== null ? pt.valAtDate - pt.cumVers : null;
      var pvCls = pv === null ? '' : (pv >= 0 ? 'pos' : 'neg');
      var pvSign = pv !== null && pv >= 0 ? '+' : '';
      var pvTxt = pv === null ? '—' : pvSign + fEur(pv);
      var valTxt = pt.valAtDate !== null ? fEur(pt.valAtDate) : null;
      var versTxt = fEur(pt.cumVers);

      var html = '<div class="ctt-date">' + pt.dateStr + '</div>';
      html += '<div class="ctt-row"><span class="ctt-lbl">Versements nets cumulés</span><span class="ctt-val blue">' + versTxt + '</span></div>';
      if (valTxt !== null) {
        html += '<div class="ctt-row"><span class="ctt-lbl">Valeur du plan</span><span class="ctt-val gold">' + valTxt + '</span></div>';
        html += '<div class="ctt-row"><span class="ctt-lbl">Plus-value</span><span class="ctt-val ' + pvCls + '">' + pvTxt + '</span></div>';
      }
      tt.innerHTML = html;
      tt.style.display = 'block';

      // Position tooltip
      var tw = tt.offsetWidth, th = tt.offsetHeight;
      var tx = e.clientX + 16, ty = e.clientY - th/2;
      if (tx + tw > window.innerWidth - 10) tx = e.clientX - tw - 16;
      if (ty < 8) ty = 8;
      if (ty + th > window.innerHeight - 8) ty = window.innerHeight - th - 8;
      tt.style.left = tx + 'px';
      tt.style.top  = ty + 'px';
    });

    canvas.addEventListener('mouseleave', function() {
      tt.style.display = 'none';
      crosshair.style.display = 'none';
    });
  });
}

     ['Valeur du portefeuille', s.valAct!==null?fEur(s.valAct):'—', ''],

     ['Rendement annualisé',    fPct(s.rendAnnPct),                  cc(s.rendAnnPct)]
    ].forEach(function(item) {
      var st = mk('div','ov-stat');
      st.innerHTML = '<span class="l">'+item[0]+'</span><span class="v '+item[2]+'">'+item[1]+'</span>';
      meta.appendChild(st);
    });
    row.appendChild(left); row.appendChild(meta);
    row.addEventListener('click', function(){ switchTab(p); });
    list.appendChild(row);
  });
}

  var d2=mk('span','chart-dot'); d2.style.background='rgba(232,150,60,0.9)';

  var d3=mk('span','chart-dot'); d3.style.background='rgba(248,113,113,0.9)';
  var l3=mk('span','chart-legend-item'); l3.appendChild(d3); l3.appendChild(document.createTextNode(' Moins-value'));

  var tt = document.getElementById('J_TT');

  requestAnimationFrame(function() {
    // On réutilise drawChartFromData avec les données globales
    var data = buildGlobalChartPts();

    drawChartFromData(canvas, data);

    // Tooltip global
    var allPts = data.allPts;
    if (!allPts || allPts.length===0) return;
    var PL=62, PR=14;
    var minTsG = allPts[0].ts, maxTsG = allPts[allPts.length-1].ts;
    var tsRangeG = maxTsG - minTsG || 1;

    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      var CW = rect.width - PL - PR;
      var relX = e.clientX - rect.left - PL;
      if (relX < 0 || relX > CW) { tt.style.display='none'; crosshair.style.display='none'; return; }
      var hoverTs = minTsG + (relX/CW)*tsRangeG;
      var idx=0, best=Infinity;
      for (var ii=0; ii<allPts.length; ii++) {
        var d2=Math.abs(allPts[ii].ts-hoverTs); if(d2<best){best=d2;idx=ii;}
      }
      var pt = allPts[idx];
      var xPx = PL + ((pt.ts-minTsG)/tsRangeG)*CW;
      crosshair.style.left=xPx+'px'; crosshair.style.top='16px';
      crosshair.style.height=(rect.height-52)+'px'; crosshair.style.display='block';
      var pv = pt.valAtDate!==null ? pt.valAtDate-pt.cumVers : null;
      var pvCls = pv===null?'':(pv>=0?'pos':'neg');
      var pvTxt = pv===null?'—':((pv>=0?'+':'')+fEur(pv));
      var html = '<div class="ctt-date">'+pt.dateStr+'</div>';
      html += '<div class="ctt-row"><span class="ctt-lbl">Versements nets cumulés</span><span class="ctt-val blue">'+fEur(pt.cumVers)+'</span></div>';
      if (pt.valAtDate!==null) {
        html += '<div class="ctt-row"><span class="ctt-lbl">Valeur totale</span><span class="ctt-val gold">'+fEur(pt.valAtDate)+'</span></div>';
        html += '<div class="ctt-row"><span class="ctt-lbl">Plus/Moins-value</span><span class="ctt-val '+pvCls+'">'+pvTxt+'</span></div>';
      }
      tt.innerHTML=html; tt.style.display='block';
      var tw=tt.offsetWidth,th=tt.offsetHeight;
      var tx=e.clientX+16, ty=e.clientY-th/2;
      if(tx+tw>window.innerWidth-10) tx=e.clientX-tw-16;
      if(ty<8) ty=8; if(ty+th>window.innerHeight-8) ty=window.innerHeight-th-8;
      tt.style.left=tx+'px'; tt.style.top=ty+'px';
    });
    canvas.addEventListener('mouseleave', function(){ tt.style.display='none'; crosshair.style.display='none'; });
  });
}

      vals.forEach(function(v) {
        var tr = mk('tr');
        tr.appendChild(mk('td','td-date',v.date));
        tr.appendChild(mk('td','td-amt',fEur(v.valeur)));
        var td = mk('td','td-act');
        var b = mkBtn('✕','btn-del');
        (function(vv){ b.addEventListener('click', function(){
          if (!confirm('Supprimer cette valeur ?')) return;
          D.vals[plan] = D.vals[plan].filter(function(x){ return !(x.date===vv.date&&x.valeur===vv.valeur); });
          saveData(); refreshPanel(plan); renderOverview();
        }); })(v);
        td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
      });
      tbl.appendChild(tb); wrap.appendChild(tbl); vhb.appendChild(wrap);
    } else {
      vhb.innerHTML = '<div class="empty">Aucune valeur enregistrée</div>';
    }
    if (vhh) { var lv=vhh.querySelector('.coll-lbl'); if(lv) lv.textContent='Historique des valeurs ('+vals.length+')'; }
  }

  // Versements collapsible
  var pvb = document.getElementById('cb-pv-'+plan);
  var pvh = document.getElementById('ch-pv-'+plan);
  if (pvb) {
    pvb.innerHTML = '';
    var wrap2 = mk('div','tbl-wrap'); wrap2.style.marginTop='12px';
    var tbl2 = mk('table');
    tbl2.innerHTML = '<thead><tr><th>Date</th><th>Montant</th><th>Note</th><th></th></tr></thead>';
    var tb2 = mk('tbody');
    if (vers.length === 0) {
      tb2.innerHTML = '<tr><td colspan="4" class="empty">Aucune opération enregistrée</td></tr>';
    } else {
      vers.forEach(function(v) {
        var tr = mk('tr');
        tr.appendChild(mk('td','td-date',v.date));
        var isRet = v.montant < 0;
        var tdA = mk('td','td-amt'+(isRet?' retrait':''));
        tdA.appendChild(mk('span','op-badge '+(isRet?'retr':'vers'), isRet?'Retrait':'Versement'));
        tdA.appendChild(document.createTextNode(fEur(v.montant)));
        tr.appendChild(tdA);
        tr.appendChild(mk('td','td-note',v.note||'—'));
        var td = mk('td','td-act');
        var b = mkBtn('✕','btn-del');
        (function(vv){ b.addEventListener('click', function(){
          if (!confirm(vv.montant < 0 ? 'Supprimer ce retrait ?' : 'Supprimer ce versement ?')) return;
          D.vers[plan] = D.vers[plan].filter(function(x){ return x.id!==vv.id; });
          saveData(); refreshPanel(plan); renderOverview();
        }); })(v);
        td.appendChild(b); tr.appendChild(td); tb2.appendChild(tr);
      });
    }
    tbl2.appendChild(tb2); wrap2.appendChild(tbl2); pvb.appendChild(wrap2);
    if (pvh) { var lp=pvh.querySelector('.coll-lbl'); if(lp) lp.textContent='Historique des versements et retraits ('+vers.length+')'; }
  }
}

// ═══════════════════════════════════
//  BUILD PANEL
// ═══════════════════════════════════
function buildPanel(plan) {
  var page = mk('div','panel-page'); page.id = 'J_PANEL_'+plan;

  var cards = mk('div','cards-row'); cards.id = 'cards-'+plan;
  page.appendChild(cards);

  var chbox = mk('div'); chbox.id = 'chbox-'+plan;
  page.appendChild(chbox);

  // Conteneur 2 colonnes
  var twoCol = mk('div','two-col-forms'); page.appendChild(twoCol);

  // Colonne gauche : valeur du portefeuille
  var vp = mk('div','panel'); vp.style.animationDelay='.1s';
  vp.appendChild(secLbl('Renseigner la valeur'));
  var vf = mk('div','form-block');
  var fvM = mkField('Valeur (€)','number','ex : 12 500.00');
  var fvD = mkDateField('Date (JJ/MM/AAAA)');
  var bv = mkBtn('Enregistrer');
  bv.addEventListener('click', function(){
    var mt=parseFloat(fvM.inp.value), dt=fvD.inp.value.trim(); var ok=true;
    if(isNaN(mt)||mt<0){setErr(fvM,'Montant invalide');ok=false;}else clrErr(fvM);
    if(!isDateOK(dt)){setErr(fvD,'Format JJ/MM/AAAA requis');ok=false;}else clrErr(fvD);
    if(!ok) return;
    D.vals[plan].push({valeur:mt,date:dt}); saveData();
    fvM.inp.value=''; fvD.inp.value='';
    refreshPanel(plan); renderOverview();
  });
  vf.appendChild(fvM.wrap); vf.appendChild(fvD.wrap); vf.appendChild(bv); vp.appendChild(vf);
  var vc = mkColl('vh-'+plan,'Historique des valeurs (0)');
  vp.appendChild(vc.wrap); twoCol.appendChild(vp);

  // Colonne droite : versement
  var pp = mk('div','panel'); pp.style.animationDelay='.15s';
  pp.appendChild(secLbl('Renseigner un versement ou un retrait'));
  var pf = mk('div','form-block');
  var fpM = mkField('Montant (€)','number','ex : 500.00');
  var fpD = mkDateField('Date (JJ/MM/AAAA)');
  var fpN = mkField('Note (optionnel)','text','Prime annuelle…'); fpN.inp.style.minWidth='100%';
  var bp = mkBtn('Enregistrer');
  // Bascule Versement / Retrait
  var opMode = 'vers';
  var opTog = mk('div','op-toggle');
  var bOpV = mk('button','on vers','＋ Versement'); bOpV.type='button';
  var bOpR = mk('button','retr','－ Retrait');      bOpR.type='button';
  function setOp(m) {
    opMode = m;
    bOpV.className = (m==='vers' ? 'on ' : '') + 'vers';
    bOpR.className = (m==='retr' ? 'on ' : '') + 'retr';
    bp.className = (m==='retr') ? 'btn retr' : 'btn';
    fpN.inp.placeholder = (m==='retr') ? 'Retrait partiel, achat immobilier…' : 'Prime annuelle…';
  }
  bOpV.addEventListener('click', function(){ setOp('vers'); });
  bOpR.addEventListener('click', function(){ setOp('retr'); });
  opTog.appendChild(bOpV); opTog.appendChild(bOpR);
  bp.addEventListener('click', function(){
    var mt=parseFloat(fpM.inp.value), dt=fpD.inp.value.trim(); var ok=true;
    if(isNaN(mt)||mt<=0){setErr(fpM,'Montant invalide');ok=false;}else clrErr(fpM);
    if(!isDateOK(dt)){setErr(fpD,'Format JJ/MM/AAAA requis');ok=false;}else clrErr(fpD);
    if(!ok) return;
    // Un retrait est stocké avec un montant négatif
    D.vers[plan].push({id:Date.now().toString(),montant:(opMode==='retr'?-mt:mt),date:dt,note:fpN.inp.value.trim()});
    saveData(); fpM.inp.value=''; fpD.inp.value=''; fpN.inp.value='';
    refreshPanel(plan); renderOverview();
  });
  // Note en haut pleine largeur, puis montant + date + bouton alignés en bas
  fpN.wrap.style.width='100%';
  var row1 = document.createElement('div');
  row1.style.cssText='display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;width:100%;';
  row1.appendChild(fpM.wrap); row1.appendChild(fpD.wrap); row1.appendChild(bp);
  pf.style.flexDirection='column';
  pf.appendChild(opTog); pf.appendChild(fpN.wrap); pf.appendChild(row1);
  pp.appendChild(pf);
  var pc = mkColl('pv-'+plan,'Historique des versements et retraits (0)');
  pp.appendChild(pc.wrap); twoCol.appendChild(pp);

  return page;
}

// ═══════════════════════════════════
//  TABS
// ═══════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.panel-page').forEach(function(p){ p.classList.remove('on'); });
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('on'); });
  var panel = document.getElementById('J_PANEL_'+name);
  var btn = document.querySelector('.tab[data-tab="'+name+'"]');
  if (panel) panel.classList.add('on');
  if (btn) btn.classList.add('on');
  if (name !== 'overview') requestAnimationFrame(function(){ renderChart(name); });
  updateActionBtns(name);
}

function addTabBtn(plan) {
  var bar = document.getElementById('J_TABS');
  var btn = mk('button','tab'); btn.dataset.tab = plan;
  btn.appendChild(document.createTextNode(plan));
  btn.addEventListener('click', function(){ switchTab(plan); });
  bar.appendChild(btn);
}

// Met à jour la visibilité des boutons d'action selon l'onglet actif
function updateActionBtns(name) {
  var btnEdit = document.getElementById('J_BTN_EDIT');
  var btnDel  = document.getElementById('J_BTN_DEL');
  if (name === 'overview') {
    btnEdit.style.display = 'none';
    btnDel.style.display  = 'none';
  } else {
    btnEdit.style.display = '';
    btnDel.style.display  = '';
  }
}

function deletePlan(plan) {
  var nb = (D.vers[plan]||[]).length;
  var msg = nb>0
    ? 'Supprimer le portefeuille "'+plan+'" et ses '+nb+' versement(s) ? Action irréversible.'
    : 'Supprimer le portefeuille "'+plan+'" ? Action irréversible.';
  if (!confirm(msg)) return;
  D.plans = D.plans.filter(function(x){ return x!==plan; });
  delete D.vers[plan]; delete D.vals[plan]; saveData();
  var btn = document.querySelector('.tab[data-tab="'+plan+'"]');
  if (btn) btn.remove();
  var pe = document.getElementById('J_PANEL_'+plan); if(pe) pe.remove();
  switchTab('overview'); renderOverview();
}

function renamePlan(plan) {
  var newName = prompt('Nouveau nom pour le portefeuille "'+plan+'" :', plan);
  if (!newName) return;
  newName = newName.trim().toUpperCase();
  if (!newName || newName === plan) return;
  if (D.plans.includes(newName)) { alert('Ce nom de portefeuille existe déjà.'); return; }
  // Renommer dans les données
  var idx = D.plans.indexOf(plan);
  D.plans[idx] = newName;
  D.vers[newName] = D.vers[plan]; delete D.vers[plan];
  D.vals[newName] = D.vals[plan]; delete D.vals[plan];
  saveData();
  // Mettre à jour l'onglet
  var tabBtn = document.querySelector('.tab[data-tab="'+plan+'"]');
  if (tabBtn) { tabBtn.dataset.tab = newName; tabBtn.childNodes[0].textContent = newName; }
  // Renommer le panel
  var pe = document.getElementById('J_PANEL_'+plan);
  if (pe) {
    pe.id = 'J_PANEL_'+newName;
    // Reconstruire le panel avec le nouveau nom
    var newPanel = buildPanel(newName);
    pe.parentNode.replaceChild(newPanel, pe);
    refreshPanel(newName);
  }
  switchTab(newName); renderOverview();
}

// ═══════════════════════════════════
//  MODAL & ACTIONS
// ═══════════════════════════════════
var modal = document.getElementById('J_MODAL');
document.getElementById('J_BTN_ADD').addEventListener('click', function(){ modal.classList.add('open'); });
document.getElementById('J_MODAL_CANCEL').addEventListener('click', closeModal);
modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
function closeModal() { modal.classList.remove('open'); document.getElementById('J_PLAN_INPUT').value=''; }

document.getElementById('J_MODAL_CONFIRM').addEventListener('click', function(){
  var name = document.getElementById('J_PLAN_INPUT').value.trim().toUpperCase();
  if (!name) { alert('Veuillez saisir un nom de portefeuille.'); return; }
  if (D.plans.includes(name)) { alert('Ce portefeuille existe déjà.'); return; }
  D.plans.push(name); D.vers[name]=[]; D.vals[name]=[]; saveData();
  var panel = buildPanel(name);
  document.getElementById('J_PLAN_PANELS').appendChild(panel);
  refreshPanel(name); addTabBtn(name); closeModal(); switchTab(name); renderOverview();
});

document.getElementById('J_BTN_EDIT').addEventListener('click', function(){
  var active = document.querySelector('.tab.on');
  if (!active || active.dataset.tab === 'overview') return;
  renamePlan(active.dataset.tab);
});

document.getElementById('J_BTN_DEL').addEventListener('click', function(){
  var active = document.querySelector('.tab.on');
  if (!active || active.dataset.tab === 'overview') return;
  deletePlan(active.dataset.tab);
});

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
document.getElementById('J_DATE').textContent = todayStr();
document.getElementById('J_TAB_OV').addEventListener('click', function(){ switchTab('overview'); });
D.plans.forEach(function(plan) {
  var panel = buildPanel(plan);
  document.getElementById('J_PLAN_PANELS').appendChild(panel);
  refreshPanel(plan);
  addTabBtn(plan);
});
renderOverview();

// Détection saisie : bloquer refresh Firebase pendant la frappe
document.addEventListener('input', function() {
  userIsTyping = true;
  if (typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(function(){ userIsTyping = false; }, 3000);
});
</script>
